<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="bootstrap.min.css">
    <title>Document</title>
</head>
<body>

<center>
    <div class="container border-5 bg-primary">
        <form class="bg-success border-3 "
              action="./login" method="post">

            <label>Username:
                <input class="rounded-3 p-1 " type="text" name="username" placeholder=" Enter Username" required>
            </label><br>

            <label>Password:
                <input class="rounded-3 p-1" type="password" name="password" placeholder=" Enter Password" required>
            </label><br>

            <label>Name:
                <input class="rounded-3 p-1" type="text" name="name" placeholder=" Enter name" required>
            </label><br>

            <label>Phone:
                <input class="rounded-3 p-1" type="text" name="phoneNumber" placeholder=" Enter phoneNumber" required>
            </label><br>

            <button type="submit">Login</button>

        </form>

    </div>

    <div class="container border-5 bg-danger ">
        <a style="text-align: center" class="bg-primary text-bg-info align-items-center" href="index.jsp">HOME</a><br>
    </div>
</center>



</body>
</html>
